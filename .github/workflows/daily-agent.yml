name: Daily ML Agent
on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-ml-agent
  cancel-in-progress: false

jobs:
  improve:
    runs-on: [self-hosted, windows, x64, ml-lab]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Ollama
        shell: pwsh
        run: |
          ollama list
          ollama show llama3.2:3b
      - name: Generate improvement
        shell: pwsh
        env:
          OLLAMA_MODEL: llama3.2:3b
        run: python -m agent.run
      - name: Validate syntax and agent tests
        shell: pwsh
        run: |
          python -m compileall -q projects agent
          python -m unittest discover -s tests -p "test_*.py"
      - name: Open review PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai-agent/daily-improvements
          commit-message: 'Llama agent: daily ML improvement'
          title: 'Llama agent: daily ML improvement'
          body: |
            Generated locally with Ollama Llama. Syntax and agent checks passed.
            Review all changes before merging. Generated ML code has not been executed.
          add-paths: |
            projects/**
